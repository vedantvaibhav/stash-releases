    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      font-display: swap;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      position: relative;
    }

    /* Animated dot-grid background */
    #bg-grid {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 48px;
      text-align: center;
      animation: fadeUp 0.5s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Text block */
    .text-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    h1 {
      font-size: 24px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.48px;
      text-align: center;
      line-height: normal;
    }

    .sub {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .sub p {
      font-size: 18px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.40);
      text-align: center;
      text-transform: lowercase;
      line-height: normal;
    }
  </style>
</head>
<body>

  <script>
    (() => {
      const canvas = document.getElementById('bg-grid');
      if (!canvas || !canvas.getContext) return;
      const ctx = canvas.getContext('2d');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const SPACING = 28;
      const DOT_SIZE = 2;
      const BASE_ALPHA = 0.13;
      const PEAK_MIN = 0.17, PEAK_MAX = 0.30;
      const DUR_MIN = 700, DUR_MAX = 1700;
      const GAP_MIN = 9000, GAP_MAX = 22000;

      let dpr = Math.max(1, window.devicePixelRatio || 1);
      let dots = [];
      let raf = null;
      let resizePending = false;

      // Stagger first flares across [0, GAP_MAX] so the field doesn't all start dark.
      function initialSchedule(d, t) {
        d.fs = t + Math.random() * GAP_MAX;
        d.fe = d.fs + DUR_MIN + Math.random() * (DUR_MAX - DUR_MIN);
        d.peak = PEAK_MIN + Math.random() * (PEAK_MAX - PEAK_MIN);
      }

      function rescheduleFlare(d, t) {
        d.fs = t + GAP_MIN + Math.random() * (GAP_MAX - GAP_MIN);
        d.fe = d.fs + DUR_MIN + Math.random() * (DUR_MAX - DUR_MIN);
        d.peak = PEAK_MIN + Math.random() * (PEAK_MAX - PEAK_MIN);
      }

      function layout() {
        resizePending = false;
        dpr = Math.max(1, window.devicePixelRatio || 1);
        const w = window.innerWidth;
        const h = window.innerHeight;
        canvas.width = Math.floor(w * dpr);
        canvas.height = Math.floor(h * dpr);
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        dots.length = 0;
        const cols = Math.ceil(w / SPACING) + 1;
        const rows = Math.ceil(h / SPACING) + 1;
        const offX = (w - (cols - 1) * SPACING) / 2;
        const offY = (h - (rows - 1) * SPACING) / 2;
        const now = performance.now();
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const d = { x: offX + c * SPACING, y: offY + r * SPACING, fs: 0, fe: 0, peak: 0 };
            initialSchedule(d, now);
            dots.push(d);
          }
        }
      }

      function paintStatic() {
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#fff';
        ctx.globalAlpha = BASE_ALPHA;
        for (let i = 0; i < dots.length; i++) {
          const d = dots[i];
          ctx.fillRect(d.x, d.y, DOT_SIZE, DOT_SIZE);
        }
        ctx.globalAlpha = 1;
      }

      function frame(t) {
        raf = null;
        if (document.hidden) return;
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#fff';
        for (let i = 0; i < dots.length; i++) {
          const d = dots[i];
          if (t >= d.fe) rescheduleFlare(d, t);
          let alpha = BASE_ALPHA;
          if (t >= d.fs) {
            // Parabolic peak: 4p(1-p) is 1 at midpoint, 0 at endpoints.
            const p = (t - d.fs) / (d.fe - d.fs);
            alpha += d.peak * 4 * p * (1 - p);
          }
          ctx.globalAlpha = alpha;
          ctx.fillRect(d.x, d.y, DOT_SIZE, DOT_SIZE);
        }
        ctx.globalAlpha = 1;
        raf = requestAnimationFrame(frame);
      }

      function start() {
        if (reduce || raf || document.hidden) return;
        raf = requestAnimationFrame(frame);
      }

      function stop() {
        if (raf) { cancelAnimationFrame(raf); raf = null; }
      }

      window.addEventListener('resize', () => {
        if (resizePending) return;
        resizePending = true;
        requestAnimationFrame(() => { layout(); if (reduce) paintStatic(); });
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { stop(); return; }
        // Reset flare schedules so resumed timestamps don't trigger a catch-up burst.
        const now = performance.now();
        for (let i = 0; i < dots.length; i++) initialSchedule(dots[i], now);
        start();
      });

      layout();
      if (reduce) paintStatic();
      else start();
    })();
  </script>

  <script>
    // Forward all OAuth params (query + hash) back to the macOS app via deep link.
    const q = new URLSearchParams(window.location.search);
    const h = new URLSearchParams(window.location.hash.slice(1));
    const merged = new URLSearchParams();
    for (const [k, v] of q) merged.set(k, v);
    for (const [k, v] of h) merged.set(k, v);
    window.location.href = "quickpanel://auth/callback?" + merged.toString();
  </script>
